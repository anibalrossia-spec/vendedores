<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VentiunGo · Cartera de Vendedores</title>
<meta name="theme-color" content="#FFD43B">
<meta name="description" content="VentiunGo Cartera de vendedores: tu equipo de ventas, sus clientes, sus ventas y la comisión de cada uno. Probala 2 meses gratis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartera">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFDF5;--surface:#FFFFFF;--surface-2:#FFF6D6;--line:#EFE6C8;--ink:#1F1B10;--muted:#6E6650;
  --y:#FFD43B;--y-2:#FFC107;--y-ink:#1F1B10;--y-soft:#FFF3BF;
  --ok:#256B3E;--ok-bg:#DDF3E4;--warn:#7A5A00;--warn-bg:#FFEFC2;--bad:#A33A3A;--bad-bg:#FCE1E1;--info:#2D5B9A;--info-bg:#E2ECFA;
  --scrim:rgba(25,20,5,.5);
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0A07;--surface:#15130D;--surface-2:#211D11;--line:#332D1B;--ink:#F6F1DF;--muted:#B3AA8C;
  --y:#FFD43B;--y-2:#FFC94A;--y-ink:#1F1B10;--y-soft:#2E2710;
  --ok:#9EDDB3;--ok-bg:#12261A;--warn:#F5D98A;--warn-bg:#2A230F;--bad:#F2A7A7;--bad-bg:#2E1515;--info:#A9C7F2;--info-bg:#14213A;
  --scrim:rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 var(--body);background:var(--bg);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:26px;font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--y-2);outline-offset:2px}

/* top */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .mk{width:36px;height:36px;border-radius:10px;background:var(--y);display:grid;place-items:center;flex:none}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.02em}
.brand b span{color:var(--y-2)}
:root[data-theme="dark"] .brand b span{color:var(--y)}
.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.top-r{display:flex;align-items:center;gap:6px}
.mtxw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.mtx{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
table.mtx th,table.mtx td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.mtx th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
table.mtx th:first-child,table.mtx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.mtx tfoot td{font-weight:800;border-bottom:0}
table.mtx tr.sel td{background:var(--y-soft)}
table.mtx button.vlink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.rk{display:flex;flex-direction:column;gap:10px}
.rk .b{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.rk .t{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.rk .t i{display:block;height:100%;background:var(--y-2);border-radius:999px}
.vtag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--y-soft);color:var(--ink);margin-left:4px;vertical-align:1px}
.filt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filt select,.filt input{height:38px;width:auto;min-width:150px}
.vend-off{opacity:.55}
.top-r .pill{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:440px){body:not(.out) .top-r [data-act=tema]{display:none}.top-r .planbadge{padding:0 10px;font-size:12px}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 0;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--y-2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.inst,.ic.inst{background:#13A36B;border-color:#13A36B;color:#fff}
@media(max-width:440px){.btn.inst .t{display:none}.btn.inst{width:38px;padding:0;border-radius:999px;height:38px}}
.pasos{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.ic{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ic svg{width:18px;height:18px}
.planbadge{height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--y);color:var(--y-ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.planbadge.bad{background:var(--bad-bg);color:var(--bad)}

/* banner */
.banner{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--y-soft);border:1px solid var(--y);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.banner b{font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.nav button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] .pill-ic{background:var(--y);color:var(--y-ink)}
.pill-ic{width:52px;height:28px;border-radius:999px;display:grid;place-items:center}

main{padding:18px 0 28px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.y{background:var(--y);border-color:var(--y);color:var(--y-ink)}
.card.y .muted{color:var(--y-ink);opacity:.72}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font:800 clamp(20px,5.2vw,26px)/1.15 var(--display);letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.y.kpi span{color:var(--y-ink);opacity:.75}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

/* buttons */
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--y);border-color:var(--y);color:var(--y-ink);font-weight:700}
.btn.primary:hover{background:var(--y-2);border-color:var(--y-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.link{background:none;border:0;padding:2px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;height:54px;padding:0 20px;border-radius:16px;border:0;background:var(--y);color:var(--y-ink);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(120,90,0,.55);cursor:pointer}
.fab svg{width:20px;height:20px}

/* chips & pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.y{background:var(--y);color:var(--y-ink)}.pill.n{background:var(--surface-2);color:var(--muted)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.btnrow{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;border-radius:0}
.list .row.btnrow:first-child{border-top:0}
.row.btnrow:hover{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 15px var(--display);background:var(--y-soft);color:var(--ink);border:1px solid var(--y)}
.av.vip{background:var(--y);border-color:var(--y-2)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* fields */
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
select.inp{appearance:auto}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:480px){.fgrid.r{grid-template-columns:minmax(0,1fr)}}
.field{min-width:0}
.help{font-size:12.5px;color:var(--muted);margin-top:4px}
.ferr{color:var(--bad);font-size:14px;min-height:0}
fieldset{border:0;padding:0;margin:0}
.sec-t{grid-column:1/-1;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec-t i{width:8px;height:8px;border-radius:50%;background:var(--y-2);display:inline-block}
.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px;border-radius:12px;background:var(--y);color:var(--y-ink)}
.calc span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.calc b{display:block;font:800 22px/1.15 var(--display)}
.pcts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.sheet{border-radius:20px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1}

/* ficha */
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:62px;height:62px;font-size:22px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--y-2);font-weight:700}
.dl{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:0;font-size:14px}
.dl dt{color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
.dl dd{margin:0;padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--y)}
.tl li{position:relative;padding:0 0 14px 6px}
.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--y);border:2px solid var(--bg)}

/* notas */
.notes{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:640px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.note.imp{background:var(--y-soft);border-color:var(--y)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* planes */
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:760px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan{display:flex;flex-direction:column;gap:10px;position:relative}
.plan.best{border:2px solid var(--y-2);background:var(--y-soft)}
.plan .price{font:800 30px/1 var(--display);letter-spacing:-.02em}
.plan ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.plan .tag{position:absolute;top:-11px;left:14px}
.plan .pcinta{margin:-26px -24px 4px;padding:9px 12px;background:var(--y-2);color:var(--y-ink);font-weight:700;font-size:13px;text-align:center;border-radius:26px 26px 0 0}
.plan .pname{font-size:22px;font-weight:600;text-align:center;margin:6px 0 0}
.plan .pold{text-decoration:line-through;color:var(--muted);font-size:14px}
.plan .price small{font-size:14px;font-weight:500;color:var(--muted)}
.checks li.no{color:var(--muted)}.checks li.no::before{content:"✕";color:#D64545}
.pdesc{background:#1E8E4E;color:#fff;border-radius:6px;padding:1px 6px;font-size:12px}
.trialcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:800 24px var(--display);background:conic-gradient(var(--y-2) var(--p),var(--surface-2) 0);position:relative}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;z-index:1;line-height:1;text-align:center}
.ring b small{display:block;font:600 10px var(--body);color:var(--muted)}

#toast{position:fixed;left:0;right:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60;padding:0 16px}
#toast div{max-width:520px;padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--y-2);min-height:2px}
.bars span{font-size:11px;color:var(--muted)}
.hidden{display:none!important}

/* páginas públicas */
body.out{padding-bottom:env(safe-area-inset-bottom,0px)}
body.out main{gap:56px;padding-top:28px;padding-bottom:56px}
.eyebrow.acc{color:#B98900;letter-spacing:.18em}
:root[data-theme="dark"] .eyebrow.acc{color:var(--y)}
.h-hero{font-size:clamp(34px,8.5vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.035em}
.h-hero em{font-style:normal;background:var(--y);color:var(--y-ink);border-radius:.16em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.h-xl{font-size:clamp(30px,7.5vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.lead{font-size:17px;max-width:56ch}
.center{text-align:center;align-items:center}
.center .lead{margin:0 auto}
.btn.xl{height:56px;padding:0 22px;font-size:17px;border-radius:999px;font-weight:700}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.facts{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{display:block;font:800 20px/1.1 var(--display);color:var(--ink)}
.demo{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;justify-self:center;transform:rotate(-1.2deg)}
.feats{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:600px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.feats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.feat{padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.feat:first-child{background:var(--y);border-color:var(--y);color:var(--y-ink)}
.feat:first-child .muted{color:var(--y-ink);opacity:.78}
.feat p{font-size:14px}
.fi{font-size:26px;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{counter-increment:s;padding-top:14px;border-top:3px solid var(--y-2);display:flex;flex-direction:column;gap:6px}
.steps li::before{content:"Paso " counter(s);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pcard{border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;position:relative}
.pcard.after{border:3px solid var(--y-2)}
.big{font:800 clamp(52px,14vw,72px)/1 var(--display);letter-spacing:-.04em}
.checks,.stars{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:16px}
.checks li,.stars li{display:flex;gap:14px;align-items:flex-start}
.checks li::before{content:"✓";color:#13A36B;font-weight:800;font-size:19px;line-height:1.2}
.stars li::before{content:"★";color:var(--y-2);font-size:18px;line-height:1.3}
.tag-r{position:absolute;top:18px;right:18px;padding:6px 14px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.plans.two{grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.plans.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.auth{max-width:560px;width:100%;margin:0 auto}
.join{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:center;padding:26px;border-radius:24px;background:var(--y-soft);border:1px solid var(--y)}
@media(min-width:700px){.join{grid-template-columns:minmax(0,1fr) auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

function hashPass(pass,salt){
  var txt=salt+':'+pass;
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  catch(_){var h=0;for(var i=0;i<txt.length;i++)h=(h*31+txt.charCodeAt(i))|0;return Promise.resolve('x'+h)}
}
function findUser(u){u=String(u||'').trim().toLowerCase();for(var i=0;i<ACCS.length;i++){var e=(ACCS[i].usuarios||[]).find(function(x){return x.u===u});if(e)return {acc:ACCS[i],e:e}}return null}

function migrarLocal(u,p){return Promise.resolve(false);
  ACCS=lsGet('cuentas')||[];var hit=findUser(u);if(!hit||hit.acc.migrado)return Promise.resolve(false);
  return hashPass(p,hit.acc.id).then(function(h){
    if(h!==hit.e.h)return false;
    var a=hit.acc,cid='c'+a.id,lcfg=lsGet(a.id+':cfg')||{};REG=true;
    return FA.createUserWithEmailAndPassword(emailDe(u),p).then(function(cr){
      var id=cr.user.uid,ref=FS.collection('carteras').doc(cid);
      return ref.set({creador:id,negocio:a.negocio||'',creado:a.creado||hoy(),trialStart:a.trialStart||hoy(),plan:a.plan||null,codigos:a.codigos||[],cfg:JSON.parse(JSON.stringify(lcfg))})
        .then(function(){return ref.collection('miembros').doc(id).set({rol:'dueno',nombre:hit.e.nombre||a.negocio||u,usuario:u,activo:true,comision:0,alta:hoy()})})
        .then(function(){return FS.collection('cartera_usuarios').doc(id).set({cid:cid})})
        .then(function(){
          var ops=[];KEYS.forEach(function(k){if(k==='cfg')return;(lsGet(a.id+':'+k)||[]).forEach(function(r){if(r&&r.id)ops.push([k,r])})});
          var chain=Promise.resolve();
          for(var i=0;i<ops.length;i+=400)(function(part){chain=chain.then(function(){var b=FS.batch();part.forEach(function(x){var c=clean(x[1]);b.set(ref.collection('items').doc(x[0]+'-'+c.id),{tipo:x[0],vend:id,d:JSON.parse(JSON.stringify(c)),t:Date.now()})});return b.commit()})})(ops.slice(i,i+400));
          return chain;
        })
        .then(function(){a.migrado=true;lsSet('cuentas',ACCS);REG=false;abrirSesion(cr.user);return true});
    }).catch(function(e){REG=false;if(e&&e.code==='auth/email-already-in-use')return false;throw e});
  });
}

/* ---------- suscripción ---------- */
function addMonths(s,n){var a=s.split('-').map(Number),d=new Date(a[0],a[1]-1+n,a[2],12);return ymd(d)}
function suscripcion(){
  if(!ACC)return {tipo:'none'};
  var h=hoy(),pl=ACC.plan;
  if(pl&&pl.hasta&&pl.hasta>=h)return {tipo:'plan',dias:diffDays(h,pl.hasta),plan:PLANES.find(function(p){return p.id===pl.id})||PLANES[0],per:PERIODOS.find(function(p){return p.id===pl.per})||PERIODOS[0]};
  var ini=ACC.trialStart||h,fin=addDays(addMonths(ini,TRIAL_MESES),-1),rest=diffDays(h,fin)+1;
  if(rest>0)return {tipo:'prueba',dias:rest,fin:fin,total:diffDays(ini,fin)+1};
  return {tipo:'vencida',fin:fin};
}
function maxUsuarios(){var s=suscripcion();return s.tipo==='plan'?s.plan.usuarios:s.tipo==='prueba'?5:1}
function puedeEditar(){if(suscripcion().tipo!=='vencida')return true;if(!esDueno()){toast('La cuenta de '+(ACC.negocio||'tu negocio')+' no tiene un plan activo. Avisale al dueño.');return false}openPlanes(true);return false}

/* ---------- reglas de negocio ---------- */
function ventasDe(id){return D.ventas.filter(function(v){return v.clienteId===id}).sort(function(a,b){return a.fecha<b.fecha?-1:1})}
function statsCli(id){
  var vs=ventasDe(id),tot=0,gan=0;vs.forEach(function(v){tot+=Number(v.monto)||0;gan+=ganancia(v)});
  var primera=vs[0]&&vs[0].fecha,ultima=vs.length?vs[vs.length-1].fecha:null,frec=null;
  if(vs.length>1)frec=Math.round(diffDays(primera,ultima)/(vs.length-1));
  return {n:vs.length,tot:tot,gan:gan,primera:primera,ultima:ultima,ticket:vs.length?tot/vs.length:0,frec:frec};
}
function estadoCli(c){
  var st=statsCli(c.id);
  if(!st.n)return {k:'prospecto',txt:'Prospecto',cls:'info'};
  if(diffDays(st.ultima,hoy())<=Number(D.cfg.diasInactivo||90))return {k:'activo',txt:'Activo',cls:'ok'};
  return {k:'inactivo',txt:'Inactivo',cls:'bad'};
}
function ganancia(v){return (Number(v.monto)||0)*(Number(v.pct)||0)/100}
function cliName(id){var c=D.clientes.find(function(x){return x.id===id});return c?c.nombre:'Sin cliente'}
function proxCumple(c){
  if(!c.cumple)return null;var p=c.cumple.split('-'),h=hoy(),y=Number(h.slice(0,4));
  var d=y+'-'+p[1]+'-'+p[2];if(d<h)d=(y+1)+'-'+p[1]+'-'+p[2];
  var edad=p[0]&&Number(p[0])>1900?Number(d.slice(0,4))-Number(p[0]):null;
  return {fecha:d,dias:diffDays(h,d),edad:edad};
}
function mesVentas(m){return D.ventas.filter(function(v){return (v.fecha||'').slice(0,7)===m})}
function mesGastos(m){return D.gastos.filter(function(g){return (g.fecha||'').slice(0,7)===m})}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):Number(x.monto)||0)},0)}
function catBadge(c){return c.cat?'<span class="pill '+(c.cat==='VIP'||c.cat==='AAA'?'y':'n')+'">'+esc(c.cat)+'</span>':''}

}
function doLogin(){
  var u=$('#l-user').value.trim().toLowerCase(),p=$('#l-pass').value;
  var fail=function(msg){S.cargando=false;S.err=msg||'Usuario o contraseña incorrectos.';render();var lu=$('#l-user');if(lu)lu.value=u;var f=$('#l-pass');if(f)f.focus()};
  if(!u||!p)return fail('Escribí tu usuario y tu contraseña.');
  if(!/^[a-z0-9._-]{3,30}$/.test(u))return fail();
  if(!fbInit())return fail('Sin conexión. Revisá internet y probá de nuevo.');
  S.err='';S.cargando=true;render();
  if(u==='ventiungo'){var tryE=function(i){return FA.signInWithEmailAndPassword(SUP_EMAILS[i],p).catch(function(e){if(i+1<SUP_EMAILS.length&&/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test((e&&e.code)||''))return tryE(i+1);throw e})};
    tryE(0).catch(function(e){fail(authErr((e&&e.code)||''))});return}
  FA.signInWithEmailAndPassword(emailDe(u),p).catch(function(e){
    var c=(e&&e.code)||'';
    if(/invalid-credential|user-not-found|wrong-password|invalid-login|invalid-email/.test(c))return migrarLocal(u,p).then(function(ok){if(!ok)throw e});
    throw e;
  }).catch(function(e){fail(authErr((e&&e.code)||''))});
}

  var err=!neg?'Escribí el nombre de tu negocio.':!/^[a-z0-9._-]{3,30}$/.test(u)?'El usuario tiene que tener de 3 a 30 letras o números, sin espacios.':p.length<6?'La contraseña tiene que tener al menos 6 caracteres.':p!==p2?'Las contraseñas no coinciden.':'';

  }).catch(function(e){
    REG=false;var c=(e&&e.code)||'';
    if(creado&&FA.currentUser){try{FA.currentUser.delete().catch(function(){FA.signOut()})}catch(_){}}
    keep(c==='auth/email-already-in-use'?'Ese usuario ya existe. Elegí otro o ingresá.':c==='auth/network-request-failed'?'Sin conexión. Revisá internet y probá de nuevo.':'No se pudo crear la cuenta. Probá de nuevo en un rato.');

function rango(){

  if(S.ep==='mesant'){var py=mo===1?y-1:y,pm=mo===1?12:mo-1,k=py+'-'+pad(pm);return {d:k+'-01',h:fin(k),t:MESES[pm-1]+' '+py}}
  if(S.ep==='3m'){var yy=y,mm=mo-2;while(mm<1){mm+=12;yy--}return {d:yy+'-'+pad(mm)+'-01',h:fin(h.slice(0,7)),t:'Últimos 3 meses'}}

function comV(s,pct){return (D.cfg.comBase==='cobrado'&&s.cobrado===false)?0:ganancia(s)*(Number(pct)||0)/100}
function pagoV(s,pct){return (D.cfg.comBase==='cobrado'&&s.cobrado===false)?0:ganancia(s)-comV(s,pct)}
function statsV(v,r){
  var vs=D.ventas.filter(function(s){return s._v===v.uid&&s.fecha>=r.d&&s.fecha<=r.h}),todas=D.ventas.filter(function(s){return s._v===v.uid});

  if(d.olvide){olvide();return}
  if(d.elegir){var pe=PLANES.find(function(x){return x.id===d.elegir}),pp=PERIODOS.find(function(x){return x.id===S.per});toast('Elegiste '+pe.nombre+' '+pp.nombre.toLowerCase()+' ('+money(precio(pe,pp))+'). Pagá con Mercado Pago y te enviamos el código de activación.');return}
  if(d.cli){S.cli=d.cli;S.view='ficha';S.cliTab='datos';render();window.scrollTo(0,0);return}
  if(d.ctab){S.cliTab=d.ctab;render();return}
  if(d.fe){S.fEstado=d.fe;render();return}
  if(d.fc){S.fCat=d.fc;render();return}
  if(d.filtro){S.fEstado=d.filtro;S.fCat='todas';S.q='';S.view='clientes';render();window.scrollTo(0,0);return}
  if(d.mes){S.mes=d.mes;render();return}
  if(d.cajatab){S.cajaTab=d.cajatab;render();return}
  if(d.nimp!=null){S.nImp=d.nimp==='1';render();return}
  if(d.hecho){var r=D.recs.find(function(x){return x.id===d.hecho});if(r){r.hecho=true;r.hechoEl=hoy();save('recs');
    if(r.clienteId){D.inter.push({id:uid(),clienteId:r.clienteId,tipo:'Seguimiento',fecha:hoy(),resumen:r.tipo+(r.nota?': '+r.nota:'')+' (hecho)'});save('inter')}
    render();toast('¡Hecho!')}return}
  if(d.editventa){mVenta(d.editventa);return}
  if(d.editgasto){mGasto(d.editgasto);return}
  if(d.editopp){mOpp(d.editopp);return}
  if(d.editnota){mNota(d.editnota);return}
  if(d.starnota){var n=D.notas.find(function(x){return x.id===d.starnota});if(n){n.imp=!n.imp;save('notas');render()}return}
  if(d.delinter){D.inter=D.inter.filter(function(x){return x.id!==d.delinter});save('inter');render();return}
  var a=d.act;
  if(a==='instalar'){instalarApp();return}
  if(a==='tema'){var dk=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',dk?'light':'dark');try{localStorage.setItem(LSP+'tema',dk?'light':'dark')}catch(_){}header();return}
  if(a==='planes'){openPlanes();return}
  if(a==='verprecios'){S.precios=!S.precios;render();if(S.precios){var pr=$('#precios');if(pr)pr.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(a==='ajustes'){mAjustes();return}
  if(a==='vendnuevo'){mVendedor(null);return}
  if(a==='excel'){excelEquipo();return}
  if(a==='cliente'){mCliente(d.edit||null);return}
  if(a==='venta'){mVenta(null,d.for||(S.view==='ficha'?S.cli:''));return}
  if(a==='gasto'){mGasto();return}
  if(a==='rec'){mRec(null,d.for||(S.view==='ficha'?S.cli:''));return}
  if(a==='inter'){mInter(d.for);return}
  if(a==='opp'){mOpp(null,d.for);return}
  if(a==='nota'){mNota();return}
});
document.addEventListener('submit',function(e){
  var id=e.target.id;if(id==='mform')return;e.preventDefault();
  if(id==='f-login')doLogin();
  else if(id==='f-reg')doRegistro();
  else if(id==='f-cod'){var r=activar($('#codigo').value);if(r!==true){$('#cod-err').textContent=r;return}S.vencidaMsg=false;render();toast('¡Plan activado! Gracias por elegir VentiunGo')}
});
document.addEventListener('input',function(e){
  if(e.target.id==='sq'){S.sq=e.target.value;S.sqf=true;render();S.sqf=false;return}
  if(e.target.id==='q'){S.q=e.target.value;render();return}
  if(e.target.id==='nq'){S.nq=e.target.value;render();return}
});
document.addEventListener('change',function(e){
  if(e.target.id==='ev'){S.ev=e.target.value;render();return}
  if(e.target.id==='epm'){S.epm=e.target.value;render();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
try{var th=localStorage.getItem(LSP+'tema');if(th)document.documentElement.setAttribute('data-theme',th)}catch(_){}
boot();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
